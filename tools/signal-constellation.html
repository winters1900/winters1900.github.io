<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Constellation — render</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#F9F7F4;}
  canvas{display:block;}
</style>
</head>
<body>
<script>
// ═══════════════════════════════════════════════════════════════════
// SIGNAL CONSTELLATION — generative algorithm
// Warm paper field; noise-persuaded lattice; adjacency graph; orange
// signal pulses radiating from an observatory core at exact center.
// Seeded + static (noLoop). Same seed -> same sky.
// ═══════════════════════════════════════════════════════════════════
const W = 1600, H = 1000;
const PAPER = '#F9F7F4';
const INK = '#1A1A1A';
const ORANGE = '#D97757';
const ORANGE_DEEP = '#C2663F';

const params = {
  seed: parseInt(new URLSearchParams(location.search).get('seed')) || 1013,
  pd: parseInt(new URLSearchParams(location.search).get('pd')) || 2,
  gridGap: 86,
  jitter: 46,
  linkRadius: 118,
  edgeFadeStart: 330,
  edgeFadeEnd: 560,
  spokeCount: 6,
  ringCount: 11
};

let nodes = [];
let edges = [];

function setup() {
  const c = createCanvas(W, H);
  c.parent(document.body);
  randomSeed(params.seed);
  noiseSeed(params.seed);
  pixelDensity(params.pd);
  noLoop();
}

function edgeFade(x, y) {
  // 1 at center, 0 toward periphery (elliptical, frame-shaped)
  const dx = (x - W / 2) / (W / 2 - 30);
  const dy = (y - H / 2) / (H / 2 - 24);
  const d = Math.sqrt(dx * dx + dy * dy);
  return constrain(1 - smoothstep(0.62, 1.02, d), 0, 1);
}
function smoothstep(a, b, x) {
  const t = constrain((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function draw() {
  // paper with a bare whisper of radial warmth
  background(PAPER);
  noStroke();
  for (let i = 26; i > 0; i--) {
    fill(255, 255, 255, 1.6);
    ellipse(W / 2, H / 2, i * 52, i * 34);
  }

  buildField();
  buildGraph();
  drawEdges();
  drawRangingRings();
  drawNodes();
  drawSpokes();
  drawCore();
}

function buildField() {
  nodes = [];
  const g = params.gridGap;
  const nx = Math.ceil(W / g) + 2;
  const ny = Math.ceil(H / g) + 2;
  for (let i = 0; i < nx; i++) {
    for (let j = 0; j < ny; j++) {
      const bx = i * g - g * 0.5;
      const by = j * g - g * 0.5;
      // layered noise persuades each lattice point
      const n1 = noise(i * 0.35, j * 0.35);
      const n2 = noise(i * 0.9 + 40, j * 0.9 + 40);
      const ang = n1 * TWO_PI * 2.0;
      const mag = params.jitter * (0.35 + 0.65 * n2);
      const x = bx + cos(ang) * mag;
      const y = by + sin(ang) * mag;
      if (x < -20 || x > W + 20 || y < -20 || y > H + 20) continue;
      const importance = noise(i * 0.5 + 90, j * 0.5 + 90);
      nodes.push({
        x, y,
        i, j,
        size: importance > 0.72 ? 3 + (importance - 0.72) * 12 : 1.4 + n2 * 1.1,
        major: importance > 0.72,
        ring: noise(i * 1.3 + 7, j * 1.3 + 7) > 0.86
      });
    }
  }
}

function buildGraph() {
  edges = [];
  // spatial hash
  const cell = params.linkRadius;
  const hash = new Map();
  const key = (cx, cy) => cx + ',' + cy;
  nodes.forEach((n, idx) => {
    n.cx = Math.floor(n.x / cell);
    n.cy = Math.floor(n.y / cell);
    const k = key(n.cx, n.cy);
    if (!hash.has(k)) hash.set(k, []);
    hash.get(k).push(idx);
  });
  nodes.forEach((n, idx) => {
    let found = [];
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const bucket = hash.get(key(n.cx + dx, n.cy + dy));
        if (!bucket) continue;
        bucket.forEach((o) => {
          if (o <= idx) return;
          const m = nodes[o];
          const d = dist(n.x, n.y, m.x, m.y);
          if (d < params.linkRadius) found.push({ o, d });
        });
      }
    }
    // keep the 3 nearest neighbors — open, readable mesh
    found.sort((a, b) => a.d - b.d);
    found.slice(0, 3).forEach(({ o, d }) => {
      edges.push({ a: idx, b: o, d });
    });
  });
  // adjacency
  nodes.forEach((n) => (n.adj = []));
  edges.forEach((e, k) => {
    nodes[e.a].adj.push({ to: e.b, e: k });
    nodes[e.b].adj.push({ to: e.a, e: k });
  });
}

function drawEdges() {
  strokeWeight(0.7);
  edges.forEach((e) => {
    const a = nodes[e.a], b = nodes[e.b];
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const f = edgeFade(mx, my);
    if (f <= 0.01) return;
    const alpha = 26 * (1 - e.d / params.linkRadius) * f;
    stroke(26, 26, 26, alpha);
    line(a.x, a.y, b.x, b.y);
  });
}

function drawNodes() {
  noStroke();
  nodes.forEach((n) => {
    const f = edgeFade(n.x, n.y);
    if (f <= 0.01) return;
    if (n.ring) {
      // small ranging ring around a few nodes
      noFill();
      strokeWeight(0.8);
      stroke(26, 26, 26, 70 * f);
      ellipse(n.x, n.y, 13 + n.size, 13 + n.size);
      noStroke();
    }
    fill(26, 26, 26, 205 * f);
    ellipse(n.x, n.y, n.size * 2, n.size * 2);
  });
}

function drawRangingRings() {
  const cx = W / 2, cy = H / 2;
  noFill();
  // concentric ranging circles
  [52, 96, 150].forEach((r, k) => {
    strokeWeight(k === 0 ? 0.9 : 0.7);
    stroke(26, 26, 26, k === 0 ? 60 : 38 - k * 8);
    ellipse(cx, cy, r * 2, r * 2);
  });
  // ticked outer ring
  const R = 196;
  strokeWeight(1);
  for (let t = 0; t < 72; t++) {
    const a = (t / 72) * TWO_PI;
    const long = t % 6 === 0;
    const r1 = R - (long ? 9 : 4);
    stroke(26, 26, 26, long ? 90 : 45);
    line(cx + cos(a) * r1, cy + sin(a) * r1,
         cx + cos(a) * R, cy + sin(a) * R);
  }
}

// find a graph node nearest a point
function nearestNode(x, y, maxD) {
  let best = -1, bd = maxD * maxD;
  nodes.forEach((n, idx) => {
    const d = distSq(n.x, n.y, x, y);
    if (d < bd) { bd = d; best = idx; }
  });
  return best;
}
function distSq(ax, ay, bx, by) {
  const dx = ax - bx, dy = ay - by;
  return dx * dx + dy * dy;
}

// a signal ray: a dense radial march from the core, bent by layered
// noise so it reads as a living trajectory; lattice nodes near the
// trajectory are then "lit" — the signal visibly travels the graph
function walkSpoke(angle, rayKey) {
  const MAXR = 318;
  const steps = 18;
  const pts = [];
  for (let k = 0; k <= steps; k++) {
    const t = k / steps;
    const r = 26 + t * (MAXR - 26);
    const bend = (noise(k * 0.22 + rayKey * 3.7, rayKey * 11.7) - 0.5) * 1.05 * t;
    const a = angle + bend;
    pts.push([W / 2 + cos(a) * r, H / 2 + sin(a) * r]);
  }
  const lit = [];
  pts.forEach((p, k) => {
    if (k === 0) return;
    const near = nearestNode(p[0], p[1], 42);
    if (near >= 0 && !lit.includes(near)) lit.push(near);
  });
  return { pts, lit };
}

function drawSpokes() {
  const spokes = [];
  const n = params.spokeCount;
  const rot = random(TWO_PI);
  for (let s = 0; s < n; s++) {
    const a = rot + (s / n) * TWO_PI + random(-0.16, 0.16);
    spokes.push(walkSpoke(a, s));
  }
  spokes.forEach((spoke, si) => {
    const { pts, lit } = spoke;
    const trunk = si === 0;
    // route
    noFill();
    strokeWeight(trunk ? 2.6 : 1.7);
    stroke(217, 119, 87, trunk ? 200 : 150);
    strokeJoin(ROUND);
    strokeCap(ROUND);
    beginShape();
    pts.forEach((p) => vertex(p[0], p[1]));
    endShape();
    // lattice nodes activated by the route
    noStroke();
    lit.forEach((idx, k) => {
      const node = nodes[idx];
      const fade = constrain(0.35 + 0.65 * (k / lit.length), 0, 1);
      fill(217, 119, 87, 220 * fade);
      ellipse(node.x, node.y, trunk ? 6.5 : 5, trunk ? 6.5 : 5);
      fill(255, 247, 243, 210 * fade);
      ellipse(node.x, node.y, 2.2, 2.2);
    });
    // a frozen pulse train travelling along the route
    const head = 0.55 + random(0.28);
    for (let k = 0; k < 5; k++) {
      const t = head - k * 0.055;
      if (t <= 0 || t >= 1) continue;
      const pos = pointOnSmooth(pts, t);
      const rr = (trunk ? 7.5 : 6) * Math.exp(-k * 0.55);
      fill(217, 119, 87, 235 * Math.exp(-k * 0.7));
      ellipse(pos[0], pos[1], rr * 2, rr * 2);
      if (k === 0) {
        noStroke();
        fill(217, 119, 87, 34);
        ellipse(pos[0], pos[1], rr * 4.6, rr * 4.6);
      }
    }
  });
}

// Catmull-Rom through lattice points
function drawSmooth(pts) {
  beginShape();
  vertex(pts[0][0], pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)];
    const p1 = pts[i];
    const p2 = pts[i + 1];
    const p3 = pts[Math.min(pts.length - 1, i + 2)];
    const c1x = p1[0] + (p2[0] - p0[0]) / 6;
    const c1y = p1[1] + (p2[1] - p0[1]) / 6;
    const c2x = p2[0] - (p3[0] - p1[0]) / 6;
    const c2y = p2[1] - (p3[1] - p1[1]) / 6;
    bezierVertex(c1x, c1y, c2x, c2y, p2[0], p2[1]);
  }
  endShape();
}

// approximate position at t in [0,1] over the smoothed route
function pointOnSmooth(pts, t) {
  // resample the polyline first
  const dense = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const steps = 6;
    for (let s = 0; s < steps; s++) {
      const u = s / steps;
      dense.push([lerp(a[0], b[0], u), lerp(a[1], b[1], u)]);
    }
  }
  dense.push(pts[pts.length - 1]);
  const idx = constrain(Math.floor(t * (dense.length - 1)), 0, dense.length - 2);
  const u = t * (dense.length - 1) - idx;
  return [lerp(dense[idx][0], dense[idx + 1][0], u),
          lerp(dense[idx][1], dense[idx + 1][1], u)];
}

function drawCore() {
  const cx = W / 2, cy = H / 2;
  noStroke();
  // halo
  fill(217, 119, 87, 22);
  ellipse(cx, cy, 70, 70);
  fill(217, 119, 87, 40);
  ellipse(cx, cy, 42, 42);
  // crosshair ticks
  stroke(26, 26, 26, 130);
  strokeWeight(1.2);
  [0, HALF_PI, PI, HALF_PI * 3].forEach((a) => {
    line(cx + cos(a) * 20, cy + sin(a) * 20, cx + cos(a) * 30, cy + sin(a) * 30);
  });
  // solid source
  noStroke();
  fill(ORANGE_DEEP);
  ellipse(cx, cy, 15, 15);
  fill(255, 247, 243, 230);
  ellipse(cx, cy, 5, 5);
}
</script>
</body>
</html>
